<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>腾讯街景元数据查看器 · 全屏地图版</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#14181d; --panel:#1d232b; --line:#2c3540; --fg:#dce3ea; --dim:#8b98a5; --accent:#4da3ff; --gold:#FFD400; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; overflow:hidden; }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:1000; }
  h1 { font-size:15px; margin:0 8px 0 0; white-space:nowrap; }
  .tab { padding:3px 12px; border-radius:14px; border:1px solid var(--line); background:transparent; color:var(--dim); cursor:pointer; }
  .tab.active { background:#173455; border-color:var(--accent); color:#fff; }
  #search { flex:1; min-width:200px; padding:6px 10px; border-radius:6px; border:1px solid var(--line); background:#10141a; color:var(--fg); }
  #search:focus { outline:none; border-color:var(--accent); }
  select { padding:5px 8px; border-radius:6px; border:1px solid var(--line); background:#10141a; color:var(--fg); max-width:190px; }
  #stats { color:var(--dim); white-space:nowrap; }
  #map { position:fixed; inset:0; background:#0d1117; }
  #map.map-dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.75); }
  #map.map-dark .leaflet-container { background:#0b0f13; }
  header, .leaflet-top.leaflet-right { z-index:1100; }
  .leaflet-top { margin-top:52px; }
  .hint { position:absolute; left:10px; top:64px; z-index:900; padding:5px 10px; border:1px solid var(--line); border-radius:7px; background:rgba(15,20,26,.88); color:var(--dim); font-size:12px; max-width:46%; }
  .hud { position:absolute; right:10px; bottom:14px; z-index:900; padding:5px 10px; border:1px solid var(--line); border-radius:7px; background:rgba(15,20,26,.85); color:var(--dim); font-size:12px; line-height:1.5; text-align:right; pointer-events:none; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pv-meta { min-width:250px; max-width:330px; font-size:12.5px; }
  .pv-meta .pid { font-family:Consolas,monospace; color:var(--accent); word-break:break-all; }
  .pv-meta table { border-collapse:collapse; margin:6px 0; width:100%; }
  .pv-meta td { padding:1px 6px 1px 0; color:var(--fg); vertical-align:top; }
  .pv-meta td.k { color:var(--dim); white-space:nowrap; }
  .pv-btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .pv-btns a, .pv-btns button { padding:4px 10px; border-radius:6px; border:1px solid var(--line); background:#10141a; color:var(--fg); cursor:pointer; text-decoration:none; font-size:12px; }
  .pv-btns a.primary { background:#173455; border-color:var(--accent); color:#fff; }
  .pv-btns a:hover, .pv-btns button:hover { border-color:var(--accent); }
  .leaflet-popup-content-wrapper { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; }
  .leaflet-popup-tip { background:var(--panel); border:1px solid var(--line); }
  .leaflet-popup-content { margin:10px 14px; }
  .leaflet-container { background:#0d1117; font-family:inherit; }
  #loadingData { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); z-index:1200; color:var(--dim); background:rgba(15,20,26,.9); border:1px solid var(--line); border-radius:8px; padding:14px 26px; display:none; }
  #nationGate { position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); z-index:1200; display:none; text-align:center; color:var(--fg); background:rgba(15,20,26,.94); border:1px solid var(--line); border-radius:12px; padding:22px 30px; box-shadow:0 14px 40px rgba(0,0,0,.45); }
  #nationGate .ng-title { font-size:16px; font-weight:600; margin-bottom:8px; }
  #nationGate .ng-sub { color:var(--dim); font-size:12.5px; line-height:1.6; margin-bottom:14px; }
  #nationGate button { padding:9px 22px; border-radius:8px; border:1px solid var(--accent); background:#173455; color:#fff; cursor:pointer; font-size:13px; }
  #nationGate button:hover { background:#1d4a7a; }
  @media (max-width:680px){
    header { padding:6px 8px; gap:6px; }
    h1 { display:none; }
    #provinceTabs { display:flex; gap:6px; width:100%; overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch; scrollbar-width:none; order:1; }
    #provinceTabs::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto; padding:6px 12px; font-size:12.5px; }
    #citySelect, #countySelect, #roadFilter, #basemapSelect, #dispMode { font-size:12.5px; max-width:32%; }
    #citySelect { order:2; } #countySelect { order:2; } #roadFilter { order:3; } #basemapSelect { order:4; }
    #search { order:5; flex:1 1 100%; min-width:0; font-size:16px; }
    #stats { order:6; width:100%; font-size:11px; }
    .hint { left:8px; right:8px; top:auto; bottom:74px; max-width:92%; font-size:11px; line-height:1.4; }
    .hud { right:8px; bottom:8px; font-size:11px; padding:4px 7px; }
    .pv-meta { min-width:0; max-width:74vw; }
    .leaflet-top { margin-top:88px; }
    .leaflet-control-zoom a { width:34px; height:34px; line-height:34px; font-size:19px; }
  }
</style>
</head>
<body>
<header>
  <h1>街景元数据查看器 <span style="font-size:12px;color:#888">v1.0.8 · 2026-10-21 镇江重扫及滨州东营数据</span></h1>
  <span id="provinceTabs"></span>
  <select id="citySelect" title="地级市"></select>
  <select id="countySelect" title="县级行政区" style="display:none"></select>
  <input id="search" placeholder="搜索: panoid / 路名(如 G219) / 日期(2013-07) / 坐标 / 定位 @16-20:SCENE">
  <select id="roadFilter"></select>
  <select id="basemapSelect" title="底图"></select>
  <select id="dispMode" title="显示模式"></select>
  <span id="stats"></span>
</header>
<div id="map"></div>
<div id="loadingData">加载数据…</div>
<div id="nationGate">
  <div class="ng-title" id="ngTitle">大数据量视图</div>
  <div class="ng-sub" id="ngSub"></div>
  <button id="nationLoadBtn">加载</button>
</div>
<div class="hint" id="mapHint">地图选点: 点击任意位置查看最近街景</div>
<div class="hud"><span id="hudZoom">Z —</span><br><span id="hudCoord">—</span></div>

<script src="data_meta.js"></script>
<script src="data_districts.js"></script>
<script src="grid_all.js"></script>
<script src="hidden_pano.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  'use strict';
  var TENCENT_VIEWER = 'https://qq-map.netlify.app/';
  var BASEMAPS = [
    { id:'amapStandard', label:'高德·标准', url:'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', subdomains:['1','2','3','4'], maxZoom:18, attribution:'© 高德地图', dark:false },
    { id:'amapDark', label:'高德·暗色', url:'https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', subdomains:['1','2','3','4'], maxZoom:18, attribution:'© 高德地图', dark:true },
    { id:'amapSatellite', label:'高德·影像', url:'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', subdomains:['1','2','3','4'], maxZoom:18, attribution:'© 高德地图', dark:false },
    { id:'tencentDark', label:'腾讯·暗色', url:'https://rt{s}.map.gtimg.com/realtimerender/?z={z}&x={x}&y={-y}&type=vector&styleid=4', subdomains:['0','1','2','3'], maxZoom:18, attribution:'© 腾讯地图', dark:true }
  ];
  var POINT_LIMIT = 1000000;
  var MIN_ZOOM = 3;            // 高德底图 z<3 不返回瓦片（手机端窄视口会白屏）
  var NATIONAL_ZOOM = 3;       // 全国视图默认瓦片层级
  var FORCE_SCATTER = 20000;   // 结果少于该值强制散点查看
  var IS_MOBILE = (window.matchMedia && window.matchMedia('(max-width:680px)').matches)
    || /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent);
  var CONFIRM_THRESHOLD = IS_MOBILE ? 10000 : 200000;
  var GRID_RES = 0.004;
  var DEEP_IN = 15;
  var DEEP_OUT = 12;
  var SEARCH_INDEX_FILE = 'pano_search_index.js';
  var SEARCH_DEBOUNCE_MS = 350;
  var GLOBAL_SEARCH_LIMIT = 100000;
  var SEARCH_PREFIX_LENGTH = 4;
  var SEARCH_PREFIX_MAX_LENGTH = 6;
  var SEARCH_SEGMENT_START = 15;
  var SEARCH_SEGMENT_END = 20;
  var state = { province:'', cityFilter:'', countyFilter:'', entries:[], results:[], distMode:false, center:null, activePid:null, bounds:null, provinceKeys:[], confirmed:{}, gateRun:null, dispMode:'density', mode:'overview', overviewCells:[], overviewMax:1, overviewTotal:0, cellPref:null, dataCity:null, autoLoaded:false, prevMode:'', prevCity:'', posQuery:null, posError:null, dispAuto:false, searchActive:false, searchPrev:null, searchResults:null, searchToken:0, searchIndexPromise:null };
  var DISP_MODES = [{ id:'density', label:'密度·省内存' }, { id:'points', label:'散点' }];
  var map=null, tileLayer=null, pointLayer=null, currentPopup=null;

  var els = {
    provTabs:document.getElementById('provinceTabs'), city:document.getElementById('citySelect'),
    county:document.getElementById('countySelect'),
    search:document.getElementById('search'), road:document.getElementById('roadFilter'),
    basemap:document.getElementById('basemapSelect'), dispMode:document.getElementById('dispMode'),
    stats:document.getElementById('stats'),
    mapHint:document.getElementById('mapHint'), loading:document.getElementById('loadingData'),
    nationGate:document.getElementById('nationGate'), nationLoadBtn:document.getElementById('nationLoadBtn'),
    ngTitle:document.getElementById('ngTitle'), ngSub:document.getElementById('ngSub'),
    hudZoom:document.getElementById('hudZoom'), hudCoord:document.getElementById('hudCoord')
  };

  function updateHudZoom(){
    if(!map||!els.hudZoom) return;
    els.hudZoom.textContent='Z '+map.getZoom();
  }
  function setHudCoord(lat,lng){
    if(!els.hudCoord) return;
    els.hudCoord.textContent=(lat==null)?'—':(lat.toFixed(5)+', '+lng.toFixed(5));
  }

  function fmtDist(m){ if(m==null) return ''; return m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(2)+' km'; }
  function haversine(lat1,lng1,lat2,lng2){
    var R=6371000,D=Math.PI/180,dLat=(lat2-lat1)*D,dLng=(lng2-lng1)*D;
    var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*D)*Math.cos(lat2*D)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.sqrt(a));
  }
  function cityMeta(key){ var m=(window.PANO_META||{})[key]; return m||{name:key,province:''}; }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function isHiddenEntry(e){ return !!e && (e[9]==='hidden' || e[8]==='腾讯隐藏'); }

  // ---------- canvas point layer ----------
  var PointCanvasLayer = (window.L && L.Layer) ? L.Layer.extend({
    initialize:function(){ this._base=[]; this._hits=[]; this._active=null; this._density=null; this._distMode=false; this._grid=null; this._cellDeg=0; this._gminLng=0; this._gminLat=0; this._glnmax=1; this._cells=null; this._cellLnmax=1; this._cellsHidden=false; },
    onAdd:function(m){
      this._map=m;
      this._canvas=L.DomUtil.create('canvas','pano-point-layer');
      var s=this._canvas.style; s.position='absolute'; s.pointerEvents='none'; s.zIndex=400;
      m.getPane('overlayPane').appendChild(this._canvas);
      m.on('move',this._sync,this);
      m.on('moveend zoomend resize viewreset',this._full,this);
      this._full();
    },
    onRemove:function(m){
      m.off('move',this._sync,this); m.off('moveend zoomend resize viewreset',this._full,this);
      L.DomUtil.remove(this._canvas); this._canvas=null;
    },
    setData:function(base,hits,active){ this._base=base||[]; this._hits=hits||[]; this._active=active||null; this._density=null; this._cells=null; this._cellsHidden=false; this._grid=null; if(this._canvas) this._full(); },
    setDensity:function(source,distMode,active){ this._cells=null; this._cellsHidden=false; this._density=source||null; this._distMode=!!distMode; this._active=active||null; this._base=[]; this._hits=[]; if(this._density) this._buildGrid(); if(this._canvas) this._full(); },
    setCells:function(cells,lnmax,active,allHidden){ this._cells=cells||null; this._cellLnmax=lnmax||1; this._active=active||null; this._density=null; this._grid=null; this._base=[]; this._hits=[]; this._cellsHidden=!!allHidden; if(this._canvas) this._full(); },
    _buildGrid:function(){
      var src=this._density, dm=this._distMode, n=src.length, i, e;
      this._grid=null;
      if(n<3000) return;
      var a=1e9,b=-1e9,c=1e9,d=-1e9;
      for(i=0;i<n;i++){ e=dm?src[i].e:src[i]; if(e[1]<a)a=e[1]; if(e[1]>b)b=e[1]; if(e[2]<c)c=e[2]; if(e[2]>d)d=e[2]; }
      if(!(b>a)||!(d>c)) return;
      var cell=Math.sqrt(((b-a)*(d-c))/30000);
      if(!(cell>0)) return;
      var NX=Math.ceil((b-a)/cell)+1, NY=Math.ceil((d-c)/cell)+1, NC=NX*NY;
      if(NC>4000000) return;
      var counts=new Int32Array(NC), idx=new Int32Array(n), k, cx, cy, maxn=0;
      for(i=0;i<n;i++){ e=dm?src[i].e:src[i]; cx=((e[1]-a)/cell)|0; cy=((e[2]-c)/cell)|0; k=cy*NX+cx; if(++counts[k]>maxn)maxn=counts[k]; }
      var offsets=new Int32Array(NC+1), s=0;
      for(k=0;k<NC;k++){ offsets[k]=s; s+=counts[k]; }
      offsets[NC]=s;
      var cur=offsets.slice(0,NC);
      for(i=0;i<n;i++){ e=dm?src[i].e:src[i]; cx=((e[1]-a)/cell)|0; cy=((e[2]-c)/cell)|0; k=cy*NX+cx; idx[cur[k]++]=i; }
      this._grid={counts:counts,offsets:offsets,idx:idx,NX:NX,NY:NY,NC:NC};
      this._cellDeg=cell; this._gminLng=a; this._gminLat=c; this._glnmax=Math.log(maxn+1)||1;
    },
    _sync:function(){ if(this._canvas) L.DomUtil.setPosition(this._canvas,this._map.containerPointToLayerPoint([0,0])); },
    _full:function(){ if(!this._canvas) return; this._resize(); this._sync(); this._redraw(); },
    _resize:function(){
      var size=this._map.getSize(), dpr=window.devicePixelRatio||1;
      this._canvas.width=Math.round(size.x*dpr); this._canvas.height=Math.round(size.y*dpr);
      this._canvas.style.width=size.x+'px'; this._canvas.style.height=size.y+'px'; this._dpr=dpr;
    },
    _redraw:function(){
      if(!this._canvas) return;
      var m=this._map,size=m.getSize(),dpr=this._dpr||1;
      var ctx=this._canvas.getContext('2d');
      ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,size.x,size.y);
      var b=m.getBounds().pad(0.2),south=b.getSouth(),north=b.getNorth(),west=b.getWest(),east=b.getEast(),i,p,pt;
      if(this._cells){
        var cells=this._cells, lnmax=this._cellLnmax;
        var ctr0=m.getCenter();
        var cpx=Math.abs(m.latLngToContainerPoint([ctr0.lat,ctr0.lng+GRID_RES]).x-m.latLngToContainerPoint([ctr0.lat,ctr0.lng]).x);
        var sz0=Math.max(1,Math.round(cpx)+1);
        for(i=0;i<cells.length;i++){
          p=cells[i];
          if(p[1]<south||p[1]>north||p[0]<west||p[0]>east) continue;
          pt=m.latLngToContainerPoint([p[1],p[0]]);
          var hid=this._cellsHidden||p[3];
          var sz=Math.max(hid?2:1,sz0);
          if(hid){
            ctx.fillStyle='rgba(255,255,255,0.9)';
            ctx.fillRect(pt.x-sz/2-1,pt.y-sz/2-1,sz+2,sz+2);
            ctx.fillStyle='#FF1A1A';
          } else {
            var t0=Math.log(p[2]+1)/lnmax;
            ctx.fillStyle='rgba('+Math.round(t0*255)+','+Math.round(229-17*t0)+','+Math.round(255-255*t0)+',0.85)';
          }
          ctx.fillRect(pt.x-sz/2,pt.y-sz/2,sz,sz);
        }
        if(this._active){
          pt=m.latLngToContainerPoint([this._active[0],this._active[1]]);
          ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
          ctx.beginPath(); ctx.arc(pt.x,pt.y,9,0,Math.PI*2); ctx.stroke();
        }
        return;
      }
      if(this._density){
        var src=this._density, dm=this._distMode, e2, ptc, g=this._grid;
        var ctr=m.getCenter();
        var cellPx=Math.abs(m.latLngToContainerPoint([ctr.lat,ctr.lng+this._cellDeg]).x
                            -m.latLngToContainerPoint([ctr.lat,ctr.lng]).x);
        var Rp=2, Tp=Math.PI*2, yy, xx, kk, j, o0, o1;
        if(g && cellPx<12){
          var a=this._gminLng, c=this._gminLat, cd=this._cellDeg, lnmax=this._glnmax, sz=Math.max(1,Math.round(cellPx)+1);
          var counts=g.counts, NX=g.NX, k, cx, gyy, glng, glat, cnt, tt;
          for(k=0;k<g.NC;k++){
            cnt=counts[k]; if(!cnt) continue;
            cx=k%NX; gyy=(k-cx)/NX; glng=a+(cx+0.5)*cd; glat=c+(gyy+0.5)*cd;
            if(glat<south||glat>north||glng<west||glng>east) continue;
            ptc=m.latLngToContainerPoint([glat,glng]); tt=Math.log(cnt+1)/lnmax;
            ctx.fillStyle='rgba('+Math.round(tt*255)+','+Math.round(229-17*tt)+','+Math.round(255-255*tt)+',0.85)';
            ctx.fillRect(ptc.x-sz/2,ptc.y-sz/2,sz,sz);
          }
        } else if(g){
          var cd2=this._cellDeg, a2=this._gminLng, c2=this._gminLat, NX2=g.NX;
          var cx0=Math.max(0,((west-a2)/cd2)|0), cx1=Math.min(g.NX-1,((east-a2)/cd2)|0);
          var cy0=Math.max(0,((south-c2)/cd2)|0), cy1=Math.min(g.NY-1,((north-c2)/cd2)|0);
          var idxs=g.idx, offs=g.offsets;
          ctx.fillStyle='#FFD400'; ctx.beginPath();
          for(yy=cy0;yy<=cy1;yy++){ for(xx=cx0;xx<=cx1;xx++){ kk=yy*NX2+xx; o0=offs[kk]; o1=offs[kk+1]; for(j=o0;j<o1;j++){ e2=dm?src[idxs[j]].e:src[idxs[j]]; if(!e2[7]||isHiddenEntry(e2)) continue; ptc=m.latLngToContainerPoint([e2[2],e2[1]]); ctx.moveTo(ptc.x+Rp,ptc.y); ctx.arc(ptc.x,ptc.y,Rp,0,Tp); } } }
          ctx.fill();
          ctx.fillStyle='#00E5FF'; ctx.beginPath();
          for(yy=cy0;yy<=cy1;yy++){ for(xx=cx0;xx<=cx1;xx++){ kk=yy*NX2+xx; o0=offs[kk]; o1=offs[kk+1]; for(j=o0;j<o1;j++){ e2=dm?src[idxs[j]].e:src[idxs[j]]; if(e2[7]||isHiddenEntry(e2)) continue; ptc=m.latLngToContainerPoint([e2[2],e2[1]]); ctx.moveTo(ptc.x+Rp,ptc.y); ctx.arc(ptc.x,ptc.y,Rp,0,Tp); } } }
          ctx.fill();
          ctx.fillStyle='#FF1A1A'; ctx.beginPath();
          for(yy=cy0;yy<=cy1;yy++){ for(xx=cx0;xx<=cx1;xx++){ kk=yy*NX2+xx; o0=offs[kk]; o1=offs[kk+1]; for(j=o0;j<o1;j++){ e2=dm?src[idxs[j]].e:src[idxs[j]]; if(!isHiddenEntry(e2)) continue; ptc=m.latLngToContainerPoint([e2[2],e2[1]]); ctx.moveTo(ptc.x+Rp,ptc.y); ctx.arc(ptc.x,ptc.y,Rp,0,Tp); } } }
          ctx.fill();
        } else {
          var cp=0, Cp=20000;
          ctx.fillStyle='#FFD400'; ctx.beginPath();
          for(i=0;i<src.length;i++){ e2=dm?src[i].e:src[i]; if(e2[2]<south||e2[2]>north||e2[1]<west||e2[1]>east||!e2[7]||isHiddenEntry(e2)) continue; ptc=m.latLngToContainerPoint([e2[2],e2[1]]); ctx.moveTo(ptc.x+Rp,ptc.y); ctx.arc(ptc.x,ptc.y,Rp,0,Tp); if(++cp%Cp===0){ ctx.fill(); ctx.beginPath(); } }
          ctx.fill();
          ctx.fillStyle='#00E5FF'; ctx.beginPath();
          for(i=0;i<src.length;i++){ e2=dm?src[i].e:src[i]; if(e2[2]<south||e2[2]>north||e2[1]<west||e2[1]>east||e2[7]||isHiddenEntry(e2)) continue; ptc=m.latLngToContainerPoint([e2[2],e2[1]]); ctx.moveTo(ptc.x+Rp,ptc.y); ctx.arc(ptc.x,ptc.y,Rp,0,Tp); if(++cp%Cp===0){ ctx.fill(); ctx.beginPath(); } }
          ctx.fill();
          ctx.fillStyle='#FF1A1A'; ctx.beginPath();

      var keys=segmentCandidates(condition);
      if(!keys&&condition[0]===1) keys=prefixCandidates(condition[2]);
      if(!keys) return;
      candidates=candidates?intersectKeys(candidates,keys):keys.slice();
    });
    return candidates;
  }
  function roadCandidates(tokens){
    var index=window.PANO_SEARCH_INDEX&&window.PANO_SEARCH_INDEX.roads;
    if(!index||!tokens.length) return null;
    var normalizedTokens=tokens.map(normalizeSearchText).filter(Boolean);
    var candidates=null;
    Object.keys(index).forEach(function(roadName){
      for(var i=0;i<normalizedTokens.length;i+=1){ if(roadName.indexOf(normalizedTokens[i])<0) return; }
      var keys=index[roadName];
      candidates=candidates?uniqueKeys(candidates.concat(keys)):keys.slice();
    });
    return candidates;
  }
  function dateCandidates(query){
    var index=window.PANO_SEARCH_INDEX&&window.PANO_SEARCH_INDEX.dates;
    if(!index||!/^\d{4}(?:-\d{2}){0,2}$/.test(query)) return null;
    var candidates=null,found=false;
    Object.keys(index).forEach(function(date){
      if(date.indexOf(query)<0) return;
      found=true;
      var keys=index[date];
      candidates=candidates?uniqueKeys(candidates.concat(keys)):keys.slice();
    });
    return found?candidates:[];
  }
  function isCjkOnly(tokens){
    if(!tokens.length) return false;
    for(var i=0;i<tokens.length;i+=1){ if(!/[\u3400-\u9fff]/.test(tokens[i])) return false; }
    return true;
  }
  function isPanoidToken(token){
    return /^[0-9a-z]{6,}$/i.test(token)&&/\d/.test(token);
  }
  function analyzeSearchQuery(query){
    var posQuery=query.charAt(0)==='@'?parsePosQuery(query):null;
    if(posQuery&&posQuery.error) return {error:posQuery.error,posQuery:posQuery};
    if(posQuery){
      return {kind:'pos',posQuery:posQuery,candidates:posCandidates(posQuery),
        matches:function(entry){ return posMatch(entry[0],posQuery.conds); }};
    }
    var coord=parseCoord(query);
    if(coord) return {kind:'coord',coord:coord,candidates:null,matches:function(){ return true; }};
    var tokens=query.toLowerCase().split(/\s+/).filter(Boolean);
    if(tokens.length===1&&isPanoidToken(tokens[0])){
      var needle=tokens[0].toLowerCase();
      return {kind:'pano',tokens:tokens,candidates:prefixCandidates(tokens[0]),
        matches:function(entry){ return String(entry[0]).toLowerCase().indexOf(needle)>=0; }};
    }
    var normalizedTokens=tokens.map(normalizeSearchText).filter(Boolean);
    var dateKeys=dateCandidates(query);
    var candidates=dateKeys!==null?dateKeys:roadCandidates(tokens);
    if(candidates===null&&isCjkOnly(normalizedTokens)) candidates=[];
    return {kind:'text',tokens:tokens,candidates:candidates,
      matches:function(entry){
        var hay=normalizeSearchText(entry[0]+' '+(entry[3]||'')+' '+(entry[4]||''));
        for(var i=0;i<normalizedTokens.length;i+=1){ if(hay.indexOf(normalizedTokens[i])<0) return false; }
        return true;
      }};
  }
  function releaseSearchKey(key){
    if(window.PANO_CITY&&window.PANO_CITY[key]){
      try{ delete window.PANO_CITY[key]; }catch(error){ console.warn('search release failed',key,error); }
    }
  }
  function sortMatchesByDistance(matches,coord){
    matches.sort(function(first,second){
      return haversine(coord.lat,coord.lng,first[2],first[1])-haversine(coord.lat,coord.lng,second[2],second[1]);
    });
  }
  function fitSearchResults(matches){
    if(!map||!matches.length) return;
    if(matches.length===1){ map.setView([matches[0][2],matches[0][1]],16); return; }
    var south=90,north=-90,west=180,east=-180;
    matches.forEach(function(entry){
      if(entry[2]<south) south=entry[2];
      if(entry[2]>north) north=entry[2];
      if(entry[1]<west) west=entry[1];
      if(entry[1]>east) east=entry[1];
    });
    if(!(east>=west)||!(north>=south)) return;
    map.fitBounds([[south,west],[north,east]],{padding:[30,30]});
    clampZoom();
  }
  function setSearchResults(matches,analysis,isTruncated){
    if(!state.searchActive){
      state.searchPrev={mode:state.mode,province:state.province,cityFilter:state.cityFilter,
        countyFilter:state.countyFilter,dataCity:state.dataCity,entries:state.entries,
        road:els.road.value||'',dispMode:state.dispMode};
    }
    state.searchActive=true;
    state.searchResults=matches;
    state.mode='detail';
    state.cityFilter=''; state.countyFilter=''; state.dataCity=null;
    state.autoLoaded=false; state.activePid=null;
    state.entries=matches; state.results=matches;
    state.distMode=false; state.posQuery=analysis.posQuery||null; state.posError=null;
    els.city.value='';
    updateCountySelect('');
    els.road.value='';
    fillRoadFilter();
    if(currentPopup){ currentPopup.remove(); currentPopup=null; }
    var note=analysis.kind==='pos'?' · panoid 定位':(analysis.kind==='pano'?' · panoid 搜索':'');
    els.stats.textContent='搜索命中 '+matches.length.toLocaleString()+' 条'+(isTruncated?' (已达到显示上限)':'')+note;
    enforceDispMode(matches.length);
    renderMapPoints();
    fitSearchResults(matches);
  }
  async function scanSearchCandidates(candidates,analysis,token){
    var matches=[],isTruncated=false,loadedKeys=[];
    try{
      for(var i=0;i<candidates.length;i+=1){
        if(token!==state.searchToken) return;
        var key=candidates[i];
        var wasLoaded=Boolean(window.PANO_CITY&&window.PANO_CITY[key]);
        if(!wasLoaded){
          try{ await loadCityScript(key); loadedKeys.push(key); }
          catch(error){ console.warn('search load failed',key,error); continue; }
        }
        var entries=(window.PANO_CITY&&window.PANO_CITY[key])||[];
        var pref=prefOf(key);
        for(var j=0;j<entries.length;j+=1){
          var entry=entries[j];
          entry[9]=pref;
          if(!analysis.matches(entry)) continue;
          matches.push(entry);
          if(matches.length>=GLOBAL_SEARCH_LIMIT){ isTruncated=true; break; }
        }
        if(!wasLoaded) releaseSearchKey(key);
        els.loading.textContent='搜索中 '+(i+1)+'/'+candidates.length+' · 命中 '+matches.length;
        if(isTruncated) break;
      }
    }finally{
      loadedKeys.forEach(releaseSearchKey);
      if(token===state.searchToken) els.loading.style.display='none';
    }
    if(token!==state.searchToken) return;
    if(analysis.kind==='coord') sortMatchesByDistance(matches,analysis.coord);
    setSearchResults(matches,analysis,isTruncated);
  }
  function runGlobalSearch(query){
    var analysis=analyzeSearchQuery(query);
    if(analysis.error){
      state.searchToken+=1;
      els.loading.style.display='none';
      els.stats.textContent='panoid 定位写法有误';
      els.mapHint.textContent='panoid 定位写法: @起始位-结束位:值  例 @16-20:SCENE 或 @1-6:350830';
      return;
    }
    if(analysis.kind==='coord'&&state.mode!=='detail'){
      els.mapHint.textContent='坐标搜索请先选择城市或省份';
      return;
    }
    var token=++state.searchToken;
    loadSearchIndex().then(function(){
      if(token!==state.searchToken) return;
      analysis=analyzeSearchQuery(query);
      var candidates=analysis.candidates;
      if(candidates&&!candidates.length){ setSearchResults([],analysis,false); return; }
      if(!candidates) candidates=allKeys();
      candidates=uniqueKeys(candidates).filter(function(key){
        return window.PANO_META&&window.PANO_META[key]&&!window.PANO_META[key].virtual;
      });
      els.loading.style.display='block';
      els.loading.textContent='搜索中 0/'+candidates.length;
      els.stats.textContent='搜索中… 候选 '+candidates.length+' 个文件';
      scanSearchCandidates(candidates,analysis,token).catch(function(error){
        if(token!==state.searchToken) return;
        els.loading.style.display='none';
        els.stats.textContent='搜索失败: '+error.message;
      });
    }).catch(function(error){
      state.searchIndexPromise=null;
      if(token!==state.searchToken) return;
      els.loading.style.display='none';
      els.stats.textContent='搜索失败: '+error.message;
    });
  }
  function restoreSearchView(){
    var previous=state.searchPrev;
    state.searchActive=false; state.searchPrev=null; state.searchResults=null;
    state.searchToken+=1;
    els.search.value='';
    els.loading.style.display='none';
    if(!previous){ selectProvince(state.province||'全国'); return; }
    if(previous.mode==='detail'&&previous.entries&&previous.entries.length){
      state.mode='detail'; state.province=previous.province;
      state.cityFilter=previous.cityFilter; state.countyFilter=previous.countyFilter;
      state.dataCity=previous.dataCity; state.entries=previous.entries;
      state.results=previous.entries; state.distMode=false; state.dispAuto=false;
      els.city.value=previous.cityFilter||'';
      updateCountySelect(previous.cityFilter||'');
      fillRoadFilter();
      els.road.value=previous.road||'';
      state.dispMode=previous.dispMode||'points';
      els.dispMode.value=state.dispMode;
      rerender(); fitMap();
      return;
    }
    if(previous.cityFilter){ els.city.value=previous.cityFilter; selectCity(previous.cityFilter); return; }
    selectProvince(previous.province||'全国');
  }

  // ---------- search ----------
  // panoid 定位检索
  //   语法: @起始位-结束位:值     (从 1 起, 含两端; 单个位置写 @16:1)
  //   多条件用 & / 逗号 / 空格连接: @1-6:350830&@16-20:SCENE
  //   例: 350830W01406200SCENE001 第16-20位为 SCENE, 第1-6位为 350830
  function parsePosQuery(q){
    if(!q||q.charAt(0)!=='@') return null;
    var body=q.slice(1).trim();
    if(!body) return {error:'@'};
    var parts=body.split(/\s*[&,，、+＋]\s*|\s+/).filter(Boolean);
    if(!parts.length) return {error:'@'};
    var conds=[];
    for(var i=0;i<parts.length;i++){
      var m=parts[i].match(/^@?(\d{1,3})\s*(?:[-~—]\s*(\d{1,3}))?\s*[:：=]\s*(.+)$/);
      if(!m) return {error:parts[i]};
      var a=parseInt(m[1],10), b=m[2]?parseInt(m[2],10):a, v=m[3].trim();
      if(!(a>=1)||b<a||!v) return {error:parts[i]};
      conds.push([a,b,v.toUpperCase()]);
    }
    return {conds:conds};
  }
  function posMatch(pid,conds){
    var s=String(pid).toUpperCase();
    for(var i=0;i<conds.length;i++){
      var c=conds[i];
      if(s.length<c[1]) return false;
      if(s.substring(c[0]-1,c[1])!==c[2]) return false;
    }
    return true;
  }
  function parseCoord(q){
    var m=q.match(/^\s*(-?\d{1,3}(?:\.\d+)?)\s*[,，;；\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
    if(!m) return null;
    var a=parseFloat(m[1]),b=parseFloat(m[2]),B=state.bounds,pad=1.5;
    if(!B) return {lat:a,lng:b};
    function inBox(lat,lng){ return lat>=B.minLat-pad&&lat<=B.maxLat+pad&&lng>=B.minLng-pad&&lng<=B.maxLng+pad; }
    if(inBox(a,b)) return {lat:a,lng:b};
    if(inBox(b,a)) return {lat:b,lng:a};
    return {lat:a,lng:b};
  }
  function computeResults(){
    if(state.searchActive){
      var searchRoad=els.road.value;
      state.results=searchRoad
        ? (state.searchResults||[]).filter(function(entry){ return (entry[3]||'')===searchRoad; })
        : (state.searchResults||[]);
      return;
    }
    var q=els.search.value.trim();
    var roadSel=els.road.value, citySel=els.city.value;
    var posQ=q?parsePosQuery(q):null;
    state.distMode=false; state.center=null;
    state.posQuery=null; state.posError=(posQ&&posQ.error)?posQ.error:null;
    if(state.posError){ state.results=[]; return; }
    state.posQuery=posQ;
    var coord=(q&&!posQ)?parseCoord(q):null;
    var tokens=(q&&!coord&&!posQ)?q.toLowerCase().split(/\s+/).filter(Boolean).map(normalizeSearchText).filter(Boolean):null;
    var out=[];
    for(var i=0;i<state.entries.length;i++){
      var e=state.entries[i];
      if(citySel&&e[9]!==citySel) continue;
      if(state.countyFilter&&e[10]!==state.countyFilter) continue;
      if(roadSel&&((e[3]||'')!==roadSel)) continue;
      if(posQ&&!posMatch(e[0],posQ.conds)) continue;
      if(tokens){
        var hay=normalizeSearchText(e[0]+' '+(e[3]||'')+' '+(e[4]||'')),ok=true;
        for(var t=0;t<tokens.length;t++){ if(hay.indexOf(tokens[t])<0){ ok=false; break; } }
        if(!ok) continue;
      }
      out.push(e);
    }
    if(coord){
      state.distMode=true; state.center=coord;
      out=out.map(function(e){ return {e:e,d:haversine(coord.lat,coord.lng,e[2],e[1])}; });
      out.sort(function(x,y){ return x.d-y.d; });
    }
    state.results=out;
  }
  function rerender(){
    if(state.mode==='overview'){
      els.stats.textContent='概览 · 约 '+state.overviewTotal.toLocaleString()+' 点 · '+state.overviewCells.length.toLocaleString()+' 格';
      renderMapPoints();
      return;
    }
    if(state.mode==='city'){
      els.stats.textContent=(state.cityFilter?cityMeta(state.cityFilter).name:'市级')+'概览 · 约 '+state.overviewTotal.toLocaleString()+' 点 · 选择/点击区县查看点位';
      renderMapPoints();
      return;
    }
    computeResults();
    enforceDispMode(state.results.length);
    var note='';
    if(state.posError) note=' · panoid 定位写法有误';
    else if(state.posQuery) note=' · panoid 定位';
    if(state.distMode) note+=' · 按距离排序';
    els.stats.textContent='共 '+state.results.length.toLocaleString()+' 条'+note;
    if(state.posError){
      els.mapHint.textContent='panoid 定位写法: @起始位-结束位:值  例 @16-20:SCENE 或 @1-6:350830';
    } else if(state.posQuery){
      els.mapHint.textContent='panoid 定位: '+state.posQuery.conds.map(function(c){
        return '第'+c[0]+(c[1]>c[0]?'-'+c[1]:'')+'位='+c[2];
      }).join(' 且 ');
    }
    renderMapPoints();
  }

  // 离开明细视图时还原显示模式选项（避免上一次小结果集的"强制散点"残留）
  function restoreDispMode(){
    var sel=els.dispMode, opt=sel?sel.options[0]:null;
    if(opt){ opt.disabled=false; opt.title=''; }
    if(state.dispAuto){ state.dispAuto=false; state.dispMode='density'; }
    if(sel && sel.value!==state.dispMode) sel.value=state.dispMode;
  }

  // 结果少于 FORCE_SCATTER 点强制散点查看；达到阈值后允许优化(密度)查看，散点仍可用
  function enforceDispMode(n){
    var sel=els.dispMode, opt=sel?sel.options[0]:null;
    if(!opt) return;
    var force=(n<FORCE_SCATTER);
    opt.title='';
    if(force && state.dispAuto){
      if(state.dispMode!=='points'){ state.dispMode='points'; sel.value='points'; }
      opt.title='结果少于 '+FORCE_SCATTER.toLocaleString()+' 点，已强制散点查看';
    } else if(state.dispAuto && state.dispMode==='points' && n>=FORCE_SCATTER){
      state.dispMode='density'; sel.value='density';
    }
  }

  // ---------- map ----------
  function initMap(){
    if(!window.L){ els.mapHint.textContent='地图组件加载失败(Leaflet CDN 不可达)'; return; }
    map=L.map('map',{center:[36,110],zoom:NATIONAL_ZOOM,minZoom:MIN_ZOOM,zoomControl:true,preferCanvas:true,attributionControl:true});
    pointLayer=new PointCanvasLayer();
    pointLayer.addTo(map);
    populateBasemaps();
    populateDispMode();
    setBasemap('amapDark');
    updateHudZoom();
    map.on('click',onMapClick);
    map.on('mousemove',onMapMove);
    map.on('mousemove',function(ev){ setHudCoord(ev.latlng.lat,ev.latlng.lng); });
    map.on('mouseout',function(){ setHudCoord(null); });
    map.on('zoomend move',updateHudZoom);
    map.on('zoomend',applyZoomLod);
    map.on('popupclose',function(){ state.activePid=null; renderMapPoints(); });
  }
  function populateBasemaps(){
    els.basemap.innerHTML='';
    BASEMAPS.forEach(function(b){
      var o=document.createElement('option'); o.value=b.id; o.textContent=b.label; els.basemap.appendChild(o);
    });
    els.basemap.onchange=function(){ setBasemap(els.basemap.value); };
  }
  function populateDispMode(){
    els.dispMode.innerHTML='';
    DISP_MODES.forEach(function(d){
      var o=document.createElement('option'); o.value=d.id; o.textContent=d.label; els.dispMode.appendChild(o);
    });
    els.dispMode.value=state.dispMode;
    els.dispMode.onchange=function(){ state.dispMode=els.dispMode.value; applyDispMode(); };
  }
  function applyDispMode(){
    if(!map){ return; }
    if(state.dispMode!=='points'||(state.mode!=='overview'&&state.mode!=='city')){
      state.dispAuto=false;
      renderMapPoints(); return;
    }
    var pref=(state.mode==='city')?(state.cityFilter||null):prefAtCenter();
    if(!pref){ state.dispAuto=false; renderMapPoints(); return; }
    state.prevMode=state.mode; state.prevCity=state.cityFilter;
    state.autoLoaded=true;
    state.dispAuto=true;
    els.city.value=pref; updateCountySelect(pref);
    els.loading.style.display='block';
    ensureCityData(pref,function(){
      els.loading.style.display='none';
      state.mode='detail'; rerender();
    });
  }
  function setBasemap(id){
    var def=BASEMAPS.filter(function(b){ return b.id===id; })[0]||BASEMAPS[0];
    if(!map) return;
    if(tileLayer) tileLayer.remove();
    tileLayer=L.tileLayer(def.url,{subdomains:def.subdomains,minZoom:MIN_ZOOM,minNativeZoom:MIN_ZOOM,maxZoom:def.maxZoom,attribution:def.attribution});
    tileLayer.addTo(map); tileLayer.bringToBack();
    els.basemap.value=def.id;
    var el=document.getElementById('map');
    if(def.dark) el.classList.add('map-dark'); else el.classList.remove('map-dark');
  }
  function renderMapPoints(){
    if(!map||!pointLayer) return;
    var entries=state.entries;
    var active=null;
    if(state.activePid){
      for(var q=0;q<entries.length;q++){
        if(entries[q][0]===state.activePid){ active=[entries[q][2],entries[q][1]]; break; }
      }
    }
    if(state.mode==='overview'||state.mode==='city'){ pointLayer.setCells(state.overviewCells, Math.log(state.overviewMax+1)||1, active, state.overviewAllHidden); return; }
    if(state.dispMode==='density'){ pointLayer.setDensity(state.results,state.distMode,active); return; }
    var citySel=els.city.value;
    var filtered=state.results.length!==entries.length;
    var base=[];
    if(filtered&&!state.searchActive){
      var added=0;
      for(var i=0;i<entries.length&&added<POINT_LIMIT;i++){
        var eb=entries[i];
        if(citySel&&eb[9]!==citySel) continue;
        if(state.countyFilter&&eb[10]!==state.countyFilter) continue;
        base.push([eb[2],eb[1],isHiddenEntry(eb)]);
        added++;
      }
    }
    var hits=[],m=Math.min(state.results.length,POINT_LIMIT);
    for(var j=0;j<m;j++){
      var e=state.distMode?state.results[j].e:state.results[j];
      hits.push([e[2],e[1],e[7],isHiddenEntry(e)]);
    }
    pointLayer.setData(base,hits,active);
  }
  function nearestEntry(lat,lng){
    var best=-1,bestD=1e18,dx,dy,d;
    for(var i=0;i<state.entries.length;i++){
      dx=state.entries[i][1]-lng; dy=state.entries[i][2]-lat;
      d=dx*dx+dy*dy;
      if(d<bestD){ bestD=d; best=i; }
    }
    return best;
  }
  function onMapClick(ev){
    if(state.mode==='city'){
      var cc=state.overviewCells; if(!cc.length||!state.cityFilter) return;
      var cb2=-1,bd2=1e18,z2,dx2,dy2,dd2;
      for(z2=0;z2<cc.length;z2++){ dx2=cc[z2][0]-ev.latlng.lng; dy2=cc[z2][1]-ev.latlng.lat; dd2=dx2*dx2+dy2*dy2; if(dd2<bd2){ bd2=dd2; cb2=z2; } }
      if(cb2<0) return;
      var cl2=cc[cb2], list2=districtsOf(state.cityFilter);
      if(list2){
        for(var j2=0;j2<list2.length;j2++){
          var c2=list2[j2], bb2=c2._bb;
          if(cl2[0]<bb2[0]||cl2[0]>bb2[2]||cl2[1]<bb2[1]||cl2[1]>bb2[3]) continue;
          if(inPolys(cl2[0],cl2[1],c2.polys)){
            els.county.value=c2.code; state.countyFilter=c2.code;
            ensureCityData(state.cityFilter,function(){ state.mode='detail'; rerender(); fitMap(); });
            return;
          }
        }
      }
      return;
    }
    if(state.mode==='overview'){
      var cs=state.overviewCells; if(!cs.length||!state.cellPref) return;
      var bi=-1,bd=1e18,z,dx,dy,d;
      for(z=0;z<cs.length;z++){ dx=cs[z][0]-ev.latlng.lng; dy=cs[z][1]-ev.latlng.lat; d=dx*dx+dy*dy; if(d<bd){ bd=d; bi=z; } }
      if(bi<0) return;
      var cl=cs[bi];
      var pf=state.cellPref[Math.floor(cl[0]/GRID_RES)*100000+Math.floor(cl[1]/GRID_RES)];
      if(pf){ els.city.value=pf; selectCity(pf); }
      return;
    }
    if(!state.entries.length) return;
    var i=nearestEntry(ev.latlng.lat,ev.latlng.lng);
    if(i<0) return;
    var e=state.entries[i];
    var px=map.latLngToContainerPoint([e[2],e[1]]);
    var cp=map.latLngToContainerPoint(ev.latlng);
    var dist=Math.sqrt((px.x-cp.x)*(px.x-cp.x)+(px.y-cp.y)*(px.y-cp.y));
    if(dist<=55){ openPopup(e); }
    else {
      var d=haversine(ev.latlng.lat,ev.latlng.lng,e[2],e[1]);
      els.mapHint.textContent='最近街景 '+fmtDist(d)+': '+(e[3]||'（无名道路）')+' · '+cityMeta(e[9]).name+' · 点击该点查看';
    }
  }
  var movePending=false,moveEv=null;
  function onMapMove(ev){
    moveEv=ev;
    if(movePending) return;
    movePending=true;
    requestAnimationFrame(function(){
      movePending=false;
      if(!moveEv||!state.entries.length) return;
      if(state.entries.length>250000){ els.mapHint.textContent='地图选点: 点击任意位置查看最近街景'; return; }
      var i=nearestEntry(moveEv.latlng.lat,moveEv.latlng.lng);
      if(i<0) return;
      var e=state.entries[i];
      var px=map.latLngToContainerPoint([e[2],e[1]]);
      var cp=map.latLngToContainerPoint(moveEv.latlng);
      var dist=Math.sqrt((px.x-cp.x)*(px.x-cp.x)+(px.y-cp.y)*(px.y-cp.y));
      els.mapHint.textContent=dist<=55 ? ('点击查看: '+(e[3]||'（无名道路）')+' · '+e[0].slice(-8)) : '地图选点: 点击任意位置查看最近街景';
    });
  }

  // ---------- metadata popup ----------
  function copyText(text,btn){
    function done(){ var o=btn.textContent; btn.textContent='已复制'; setTimeout(function(){ btn.textContent=o; },1200); }
    if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,function(){ fallback(); }); }
    else fallback();
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){}
      document.body.removeChild(ta);
    }
  }
  function popupHtml(e){
    var meta=cityMeta(e[9]);
    var jump=buildJumpUrl(e);
    return '<div class="pv-meta">'
      +'<div class="pid">'+esc(e[0])+'</div>'
      +'<table>'
      +'<tr><td class="k">位置</td><td>'+esc(meta.province)+' · '+esc(meta.name)+'</td></tr>'
      +'<tr><td class="k">道路</td><td>'+esc(e[3]||'（无名道路）')+'</td></tr>'
      +'<tr><td class="k">采集</td><td>'+esc(e[4]||'—')+'</td></tr>'
      +'<tr><td class="k">朝向</td><td>'+esc(e[5]||'—')+'°</td></tr>'
      +'<tr><td class="k">坐标</td><td>'+e[2].toFixed(6)+', '+e[1].toFixed(6)+' (GCJ-02)</td></tr>'
      +(e[8]?'<tr><td class="k">来源</td><td>'+esc(e[8])+'</td></tr>':'')
      +'<tr><td class="k">素材</td><td>'+(e[7]?'含全景 4096×2048':(e[6]?'仅缩略图':'仅元数据'))+'</td></tr>'
      +'</table>'
      +'<div class="pv-btns">'
      +'<a class="primary" href="'+esc(jump)+'" target="_blank" rel="noopener">打开街景 ↗</a>'
      +'<button data-act="pid">复制 panoid</button>'
      +'<button data-act="coord">复制坐标</button>'
      +'<button data-act="link">复制链接</button>'
      +'<button data-act="zoom">定位</button>'
      +'</div></div>';
  }
  function openPopup(e){
    state.activePid=e[0];
    renderMapPoints();
    if(currentPopup){ currentPopup.remove(); }
    currentPopup=L.popup({maxWidth:360,autoPan:true})
      .setLatLng([e[2],e[1]])
      .setContent(popupHtml(e))
      .openOn(map);
    var node=currentPopup.getElement();
    var jump=buildJumpUrl(e);
    node.querySelector('[data-act="pid"]').onclick=function(ev){ copyText(e[0],ev.target); };
    node.querySelector('[data-act="coord"]').onclick=function(ev){ copyText(e[2].toFixed(6)+','+e[1].toFixed(6),ev.target); };
    node.querySelector('[data-act="link"]').onclick=function(ev){ copyText(jump,ev.target); };
    node.querySelector('[data-act="zoom"]').onclick=function(){ map.setView([e[2],e[1]],17); };
  }

  // ---------- controls ----------
  var searchTimer=null;
  els.search.addEventListener('input',function(){
    clearTimeout(searchTimer);
    var query=els.search.value.trim();
    if(!query){
      if(state.searchActive) restoreSearchView(); else rerender();
      return;
    }
    var posQ=query.charAt(0)==='@'?parsePosQuery(query):null;
    var wantsGlobal=Boolean(posQ&&!posQ.error)||(isPanoidToken(query)&&query.replace(/\s+/g,'').length>=6);
    if(state.mode==='detail'&&!state.searchActive&&!wantsGlobal){
      searchTimer=setTimeout(rerender,SEARCH_DEBOUNCE_MS);
      return;
    }
    if(parseCoord(query)&&state.mode!=='detail'){
      els.mapHint.textContent='坐标搜索请先选择城市或省份';
      return;
    }
    searchTimer=setTimeout(function(){ runGlobalSearch(query); },SEARCH_DEBOUNCE_MS);
  });
  els.road.addEventListener('change',rerender);
  els.nationLoadBtn.addEventListener('click',function(){
    if(state.gateRun){ var r=state.gateRun; state.gateRun=null; r(); }
  });
  els.city.addEventListener('change',function(){ selectCity(els.city.value); });
  els.county.addEventListener('change',function(){
    state.countyFilter=els.county.value;
    if(currentPopup){ currentPopup.remove(); currentPopup=null; }
    state.activePid=null;
    var city=state.cityFilter||els.city.value;
    if((state.mode==='city'||state.mode==='detail')&&city){
      state.autoLoaded=false;
      if(state.countyFilter){
        els.loading.style.display='block';
        ensureCityData(city,function(){
          els.loading.style.display='none';
          state.mode='detail'; rerender(); fitMap();
        });
      } else { showCityGrid(city); }
    } else { rerender(); fitMap(); }
  });
  window.addEventListener('resize',function(){ if(map) map.invalidateSize(); });
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'&&currentPopup){ currentPopup.remove(); state.activePid=null; renderMapPoints(); }
  });

  // ---------- init ----------
  if(!window.PANO_META||!Object.keys(window.PANO_META).length){
    els.mapHint.textContent='数据文件未加载: 请确认 data_meta.js 与本页面在同一目录';
    return;
  }
  initMap();
  selectProvince('全国');
  setTimeout(function(){ if(map) map.invalidateSize(); },300);
})();
</script>
</body>
</html>
